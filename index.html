    <style>
        :root {
            --emerald: #042e1c;
            --emerald-light: #064e32;
            --emerald-soft: #f0f7f4;
            --gold: #c29d38;
            --gold-light: #dfb74a;
            --gold-soft: #fbf7ec;
            --charcoal: #0f172a;
            --slate: #475569;
            --cream: #fafaf9;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 12px 30px -5px rgba(4, 46, 28, 0.08), 0 8px 16px -6px rgba(4, 46, 28, 0.04);
            --shadow-lg: 0 20px 40px -10px rgba(4, 46, 28, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --header-height: 75px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--charcoal);
            background-color: var(--cream);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            color: var(--emerald);
        }

        .section-scroll {
            scroll-margin-top: var(--header-height);
        }

        /* PREMIUM STICKY HEADER */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 6%;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1010;
            border-bottom: 1px solid rgba(4, 46, 28, 0.06);
            box-shadow: var(--shadow-sm);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-light));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-weight: 800;
            font-size: 18px;
            border: 1px solid var(--gold);
        }

        .logo h1 {
            font-size: 21px;
            color: var(--emerald);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
        }

        .nav-links li {
            display: inline-block;
        }

        .nav-links a {
            color: var(--slate);
            text-decoration: none;
            margin-left: 28px;
            font-weight: 500;
            font-size: 15px;
            padding: 8px 0;
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--emerald);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--gold);
            transition: var(--transition);
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        /* MOBILE MENU BUTTON */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1030;
        }

        .menu-toggle.open {
            position: relative;
            z-index: 1040;
        }

        .menu-toggle span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: var(--emerald);
            border-radius: 3px;
            transition: var(--transition);
        }

        .menu-toggle.open span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .menu-toggle.open span:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.open span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* BACKGROUND OVERLAY WHEN SIDE MENU OPEN */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 46, 28, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1011;
        }
        .menu-overlay.active {
            display: block;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(rgba(4, 46, 28, 0.85), rgba(2, 20, 12, 0.95)), 
                        url('https://images.unsplash.com/photo-1542816417-0f0c8427427a?q=80&w=1600') no-repeat center center/cover;
            color: var(--white);
            text-align: center;
            padding: 140px 24px 160px;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to top, var(--cream), transparent);
        }

        .hero h2 {
            color: var(--white);
            font-size: 46px;
            line-height: 1.25;
            margin-bottom: 20px;
            letter-spacing: -1px;
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 18px;
            max-width: 680px;
            margin: 0 auto 35px;
            color: #cbd5e1;
            font-weight: 400;
        }

        .hero-btn-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* PREMIUM BUTTONS */
        .btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--emerald);
            padding: 14px 32px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 14px rgba(194, 157, 56, 0.35);
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(194, 157, 56, 0.5);
            background: var(--white);
            color: var(--emerald);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            padding: 14px 32px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: var(--white);
            color: var(--emerald);
            border-color: var(--white);
            transform: translateY(-2px);
        }

        /* GRID OVERLAY CARDS */
        .grid-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: -60px auto 60px;
            padding: 0 24px;
            position: relative;
            z-index: 10;
        }

        .card-info {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            border-bottom: 3px solid var(--gold);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .card-info:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .card-info-icon {
            width: 45px;
            height: 45px;
            background: var(--emerald-soft);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--emerald);
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .card-info h3 {
            font-size: 19px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .card-info p {
            color: var(--slate);
            font-size: 14.5px;
            line-height: 1.6;
        }

        /* SECTIONS WRAPPER */
        section {
            padding: 90px 6% 70px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-header h2 {
            font-size: 34px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
        }

        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background: var(--gold);
            border-radius: 2px;
        }

        .section-header p {
            color: var(--slate);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* FACULTY LAYOUT */
        .about-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 45px;
            align-items: center;
        }

        .about-image-side {
            position: relative;
        }

        .about-img-box {
            width: 100%;
            height: 420px;
            border-radius: 16px;
            background: linear-gradient(rgba(4, 46, 28, 0.2), rgba(4, 46, 28, 0.4)),
                        url('https://images.unsplash.com/photo-1564507592333-c60657eea523?q=80&w=800') no-repeat center center/cover;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(194, 157, 56, 0.2);
        }

        .experience-badge {
            position: absolute;
            bottom: -20px;
            right: 20px;
            background: var(--emerald);
            color: var(--white);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--gold);
        }

        .experience-badge .num {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
            line-height: 1;
            display: block;
        }

        .experience-badge .txt {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
        }

        .profile-box {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .profile-tag {
            color: var(--gold);
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: inline-block;
            background: var(--gold-soft);
            padding: 4px 12px;
            border-radius: 4px;
        }

        .profile-box h3 {
            font-size: 26px;
            margin-bottom: 18px;
        }

        .profile-box p {
            margin-bottom: 18px;
            font-size: 15px;
            color: #334155;
        }

        /* 4-STEP FRAMEWORK TIMELINE */
        .methodology-box {
            margin-top: 35px;
            background: var(--emerald-soft);
            padding: 25px;
            border-radius: 12px;
            border-top: 3px solid var(--emerald);
        }

        .methodology-box h4 {
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .methodology-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .method-step {
            background: var(--white);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
        }

        .method-step span {
            color: var(--gold);
            font-weight: 700;
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
        }

        .method-step h5 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .method-step p {
            font-size: 12.5px;
            color: var(--slate);
            line-height: 1.4;
            margin-bottom: 0;
        }

        /* PROGRAMS ROW DESIGN */
        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .program-item {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
        }

        .program-item:hover {
            border-color: var(--gold);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .program-meta h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .program-meta p {
            color: var(--slate);
            font-size: 14.5px;
            margin-bottom: 20px;
        }

        .program-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .program-list li {
            font-size: 14px;
            color: #334155;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .program-list li::before {
            content: "✦";
            color: var(--gold);
            position: absolute;
            left: 0;
            font-size: 11px;
        }

        /* TUITION / PRICING CARDS */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            align-items: stretch;
        }

        .price-card {
            background: var(--white);
            padding: 35px 24px;
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: var(--transition);
        }

        .price-card.featured {
            border: 2px solid var(--gold);
            box-shadow: var(--shadow-lg);
            transform: scale(1.03);
            background: var(--gold-soft);
        }

        .popular-badge {
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--emerald);
            padding: 4px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(194, 157, 56, 0.25);
        }

        .price-card h3 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .price-card .cost {
            font-size: 38px;
            font-weight: 800;
            color: var(--charcoal);
            margin-bottom: 20px;
        }

        .price-card .cost span {
            font-size: 14px;
            color: var(--slate);
            font-weight: 400;
        }

        .price-list {
            list-style: none;
            text-align: left;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .price-list li {
            font-size: 13.5px;
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
            color: #334155;
        }

        .price-list li::before {
            content: "✓";
            color: var(--emerald);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .custom-note {
            text-align: center;
            margin-top: 35px;
            font-size: 14.5px;
            color: var(--slate);
            background: var(--white);
            padding:
